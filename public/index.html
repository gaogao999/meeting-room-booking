<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Room Booking</title>
  <link href="/vendor/bootstrap.min.css" rel="stylesheet" />
  <link href="/timeline.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-dark app-nav">
    <div class="container-fluid px-3 px-md-4 d-flex align-items-stretch" style="min-height:60px">
      <a class="navbar-brand d-flex align-items-center me-4" href="/">Meeting Room Booking</a>
      <div class="d-flex align-items-stretch gap-1 me-auto">
        <a class="nav-link active" href="/">Booking</a>
        <a class="nav-link" href="/rooms.html">Rooms</a>
        <a class="nav-link" href="/stats.html">Analytics</a>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="small" style="color:rgba(255,255,255,.55)" id="appVersion"></span>
        <div class="user-chip" id="currentUser" hidden>
          <div class="avatar" id="userInitials"></div>
          <div>
            <div class="nm" id="userName"></div>
            <div class="dp" id="userDept"></div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-3 px-md-4 my-3">
    <div class="row g-4 booking-row">
      <!-- New reservation: pick time first, then choose from available rooms -->
      <div class="col-xl-4">
        <div class="panel sticky-form">
          <div class="panel-head">
            <div class="panel-title">New reservation</div>
            <div class="panel-sub">Pick a time, then a free room.</div>
          </div>
          <div class="card-body p-3">
            <div id="formAlert"></div>
            <form id="bookingForm">
              <!-- Step 1: choose date/time -->
              <div class="step"><span class="num">1</span><span class="ttl">When</span></div>
              <label class="form-label d-block" for="date">Date <span class="text-danger">*</span></label>
              <div class="d-flex gap-2 mb-2">
                <input type="date" class="form-control" id="date" required />
                <button type="button" class="btn btn-outline-secondary fw-semibold text-nowrap" id="dateToday">Today</button>
              </div>
              <div class="row">
                <div class="col-6 mb-2">
                  <label class="form-label d-block">Start <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <select class="form-select" id="startHour" required></select>
                    <span class="input-group-text px-2">:</span>
                    <select class="form-select" id="startMin" required></select>
                  </div>
                </div>
                <div class="col-6 mb-2">
                  <label class="form-label d-block">End <span class="text-danger">*</span></label>
                  <div class="input-group">
                    <select class="form-select" id="endHour" required></select>
                    <span class="input-group-text px-2">:</span>
                    <select class="form-select" id="endMin" required></select>
                  </div>
                </div>
              </div>
              <div class="panel-sub mb-3" id="slotSummary"></div>

              <!-- Step 2: choose from the rooms available for that time -->
              <div class="step">
                <span class="num">2</span><span class="ttl">Which room</span>
                <span class="badge-free" id="freeCount"></span>
              </div>
              <div class="panel-sub mb-2">Only rooms free for this time are listed.</div>
              <select class="form-select mb-1" id="roomId" required disabled>
                <option value="">Select a date and time</option>
              </select>
              <div class="form-text mb-3" id="availHint"></div>

              <!-- Step 3: details -->
              <div class="step"><span class="num">3</span><span class="ttl">Details</span></div>
              <div class="row">
                <div class="col-6 mb-2">
                  <label class="form-label d-block" for="department">Department <span class="text-danger">*</span></label>
                  <select class="form-select" id="department" required></select>
                </div>
                <div class="col-6 mb-2">
                  <label class="form-label d-block" for="reserver">Name <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="reserver" required />
                </div>
              </div>
              <label class="form-label d-block" for="purpose">Purpose <span class="fw-normal text-secondary">(optional)</span></label>
              <input type="text" class="form-control mb-3" id="purpose" placeholder="e.g. Line 3 review" />
              <button type="submit" class="btn-book" id="bookBtn" disabled>Select a room first</button>
            </form>
            <div class="rule-hint" id="ruleHintWrap">
              <span id="ruleHint"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Schedule (timeline) -->
      <div class="col-xl-8">
        <div class="panel">
          <div class="panel-head d-flex align-items-center flex-wrap gap-3">
            <div class="tl-dateblock">
              <div class="panel-title">Schedule</div>
              <div class="panel-sub" id="tlDateLabel"></div>
            </div>
            <div class="d-flex align-items-center gap-2">
              <button class="btn btn-outline-secondary" id="prevDay" aria-label="Previous day">&lt;</button>
              <button class="btn btn-outline-secondary fw-semibold" id="today">Today</button>
              <button class="btn btn-outline-secondary" id="nextDay" aria-label="Next day">&gt;</button>
              <input type="date" class="form-control" id="tlDate" style="width:auto" />
            </div>
            <div class="ms-auto d-flex align-items-center gap-3 panel-sub">
              <span class="d-flex align-items-center gap-2"><span class="sw" style="width:14px;height:14px;border-radius:4px;background:#2563eb"></span>Booked</span>
              <span class="d-flex align-items-center gap-2"><span style="width:14px;height:14px;border-radius:4px;border:1.5px dashed #9fb0c2;background:#f6f9fd"></span>Free — click to book</span>
            </div>
          </div>

          <div class="chipbar">
            <span class="lbl">Location</span>
            <div class="d-flex align-items-center gap-2 flex-wrap" id="locFilters"></div>
          </div>

          <div id="timeline" class="timeline"></div>
          <p class="panel-foot panel-sub mb-0" id="tlRangeNote"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Booking detail modal -->
  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Booking Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="detailBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-danger" id="detailCancel">Cancel Booking</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/vendor/bootstrap.bundle.min.js"></script>
  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
